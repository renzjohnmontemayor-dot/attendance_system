<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Global Academy | Smart RFID Attendance</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --maroon:#711f25;
    --maroon-dark:#4b1217;
    --maroon-light:#8d3037;
    --gold:#d5a23a;
    --gold-light:#f1d27a;
    --cream:#fffaf0;
    --white:#ffffff;
    --gray:#6b7280;
    --light:#f6f6f6;
    --border:#e5e7eb;
    --green:#15803d;
    --red:#dc2626;
    --blue:#2563eb;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    color:#292929;
}

/* =========================
   LOGIN
========================= */

.login-screen{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        linear-gradient(
            rgba(75,18,23,.95),
            rgba(113,31,37,.95)
        );
    padding:20px;
}

.login-box{
    width:100%;
    max-width:420px;
    background:white;
    border-radius:18px;
    padding:35px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.login-logo{
    width:80px;
    height:80px;
    margin:0 auto 15px;
    border-radius:50%;
    background:var(--maroon);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--gold);
    font-weight:bold;
    font-size:25px;
    border:4px solid var(--gold);
}

.login-box h1{
    text-align:center;
    color:var(--maroon);
    font-size:25px;
}

.login-box p{
    text-align:center;
    color:var(--gray);
    margin:7px 0 25px;
}

.input-group{
    margin-bottom:16px;
}

.input-group label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:7px;
}

.input-group input{
    width:100%;
    padding:13px;
    border:1px solid var(--border);
    border-radius:9px;
    outline:none;
    font-size:14px;
}

.input-group input:focus{
    border-color:var(--gold);
}

.login-btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:9px;
    background:var(--maroon);
    color:white;
    font-weight:bold;
    cursor:pointer;
    font-size:15px;
}

.login-btn:hover{
    background:var(--maroon-dark);
}

.login-error{
    margin-top:12px;
    color:var(--red);
    font-size:13px;
    text-align:center;
}

/* =========================
   APP
========================= */

#app{
    display:none;
    min-height:100vh;
}

.header{
    background:var(--maroon);
    color:white;
    padding:16px 25px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.header-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.header-logo-wrap{
    width:48px;
    height:48px;
    border-radius:50%;
    border:2px solid var(--gold);
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:white;
}

.header-logo-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.header-logo-text{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--maroon);
    font-weight:bold;
    font-size:13px;
}

.header h2{
    font-size:19px;
}

.header small{
    display:block;
    color:var(--gold-light);
    margin-top:2px;
}

.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.logout-btn{
    border:1px solid rgba(255,255,255,.4);
    background:transparent;
    color:white;
    padding:8px 13px;
    border-radius:7px;
    cursor:pointer;
}

.logout-btn:hover{
    background:rgba(255,255,255,.1);
}

/* =========================
   CONTAINER
========================= */

.container{
    max-width:1450px;
    margin:auto;
    padding:25px;
}

/* =========================
   STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:white;
    border-radius:13px;
    padding:20px;
    border:1px solid var(--border);
}

.stat-title{
    color:var(--gray);
    font-size:13px;
    margin-bottom:8px;
}

.stat-value{
    font-size:28px;
    font-weight:bold;
    color:var(--maroon);
}

/* =========================
   TOOLBAR
========================= */

.toolbar{
    background:white;
    padding:15px;
    border-radius:13px;
    border:1px solid var(--border);
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.search{
    flex:1;
    min-width:200px;
    padding:11px 13px;
    border:1px solid var(--border);
    border-radius:8px;
    outline:none;
}

.date-input{
    padding:11px;
    border:1px solid var(--border);
    border-radius:8px;
}

.filter-btn{
    padding:10px 14px;
    border-radius:8px;
    border:1px solid var(--border);
    background:white;
    cursor:pointer;
}

.filter-btn.active{
    background:var(--maroon);
    color:white;
    border-color:var(--maroon);
}

.add-btn{
    padding:10px 15px;
    border:none;
    background:var(--gold);
    color:var(--maroon-dark);
    font-weight:bold;
    border-radius:8px;
    cursor:pointer;
}

.add-btn:hover{
    background:var(--gold-light);
}

/* =========================
   MAIN LAYOUT
========================= */

.dashboard-grid{
    display:grid;
    grid-template-columns:1fr 340px;
    gap:20px;
}

.panel{
    background:white;
    border:1px solid var(--border);
    border-radius:13px;
    overflow:hidden;
}

.panel-header{
    padding:17px 20px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.panel-header h3{
    color:var(--maroon);
    font-size:17px;
}

/* =========================
   STUDENTS
========================= */

.student-grid{
    padding:18px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.student-card{
    border:1px solid var(--border);
    border-radius:11px;
    padding:15px;
    position:relative;
    background:#fff;
}

.student-name{
    font-weight:bold;
    color:var(--maroon);
    padding-right:35px;
}

.student-id{
    color:var(--gray);
    font-size:13px;
    margin-top:4px;
}

.student-section{
    font-size:13px;
    margin-top:5px;
}

.student-status{
    margin-top:12px;
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
}

.status-present{
    background:#dcfce7;
    color:var(--green);
}

.status-absent{
    background:#fee2e2;
    color:var(--red);
}

.status-timeout{
    background:#dbeafe;
    color:var(--blue);
}

.delete-btn{
    position:absolute;
    right:12px;
    top:12px;
    width:28px;
    height:28px;
    border:none;
    border-radius:7px;
    background:#fee2e2;
    color:var(--red);
    cursor:pointer;
    font-weight:bold;
}

.delete-btn:hover{
    background:#fecaca;
}

.empty{
    padding:35px;
    text-align:center;
    color:var(--gray);
}

/* =========================
   SIDEBAR
========================= */

.sidebar-panel{
    margin-bottom:20px;
}

.latest-scan{
    padding:20px;
    text-align:center;
}

.scan-icon{
    width:65px;
    height:65px;
    border-radius:50%;
    margin:0 auto 12px;
    background:#fff4d6;
    border:2px solid var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--maroon);
    font-size:25px;
}

.latest-name{
    font-size:18px;
    font-weight:bold;
    color:var(--maroon);
}

.latest-info{
    color:var(--gray);
    font-size:13px;
    margin-top:5px;
}

.scan-list{
    padding:10px 15px;
}

.scan-item{
    padding:12px 5px;
    border-bottom:1px solid var(--border);
}

.scan-item:last-child{
    border-bottom:none;
}

.scan-item strong{
    color:var(--maroon);
    font-size:13px;
}

.scan-item small{
    display:block;
    color:var(--gray);
    margin-top:3px;
}

.print-btn{
    width:calc(100% - 30px);
    margin:15px;
    padding:12px;
    border:none;
    border-radius:8px;
    background:var(--maroon);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.print-btn:hover{
    background:var(--maroon-dark);
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:1000;
}

.modal-box{
    background:white;
    width:100%;
    max-width:500px;
    border-radius:15px;
    padding:25px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.modal-header h3{
    color:var(--maroon);
}

.close-btn{
    border:none;
    background:none;
    font-size:25px;
    cursor:pointer;
    color:var(--gray);
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.form-group{
    margin-bottom:12px;
}

.form-group.full{
    grid-column:1/-1;
}

.form-group label{
    display:block;
    font-size:12px;
    font-weight:bold;
    margin-bottom:5px;
}

.form-group input{
    width:100%;
    padding:11px;
    border:1px solid var(--border);
    border-radius:8px;
}

.save-btn{
    width:100%;
    padding:12px;
    background:var(--maroon);
    color:white;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    background:#222;
    color:white;
    padding:13px 18px;
    border-radius:9px;
    display:none;
    z-index:2000;
    box-shadow:0 5px 20px rgba(0,0,0,.2);
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .dashboard-grid{
        grid-template-columns:1fr;
    }

    .student-grid{
        grid-template-columns:1fr;
    }
}

@media(max-width:600px){

    .header{
        padding:12px 15px;
    }

    .header h2{
        font-size:15px;
    }

    .header small{
        font-size:10px;
    }

    .header-logo-wrap{
        width:40px;
        height:40px;
    }

    .container{
        padding:12px;
    }

    .stats{
        gap:8px;
    }

    .stat{
        padding:14px;
    }

    .stat-value{
        font-size:23px;
    }

    .toolbar{
        flex-direction:column;
    }

    .search,
    .date-input,
    .filter-btn,
    .add-btn{
        width:100%;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="loginScreen" class="login-screen">

    <div class="login-box">

        <div class="login-logo">
            GA
        </div>

        <h1>Global Academy</h1>
        <p>Smart RFID Attendance System</p>

        <div class="input-group">
            <label>Email</label>
            <input
                type="email"
                id="loginEmail"
                placeholder="Admin email"
            >
        </div>

        <div class="input-group">
            <label>Password</label>
            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
            >
        </div>

        <button class="login-btn" onclick="login()">
            LOGIN
        </button>

        <div id="loginError" class="login-error"></div>

    </div>

</div>


<!-- =========================
     APP
========================= -->

<div id="app">

    <header class="header">

        <div class="header-left">

            <div class="header-logo-wrap">

                <!--
                If you have a logo, replace this div with:

                <img src="YOUR_LOGO.png">
                -->

                <div class="header-logo-text">
                    GA
                </div>

            </div>

            <div>
                <h2>Global Academy</h2>
                <small>Smart RFID Attendance System</small>
            </div>

        </div>

        <div class="header-right">

            <button
                class="logout-btn"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </header>


    <main class="container">

        <!-- STATS -->

        <section class="stats">

            <div class="stat">
                <div class="stat-title">
                    Total Students
                </div>

                <div
                    class="stat-value"
                    id="totalStudents"
                >
                    0
                </div>
            </div>

            <div class="stat">
                <div class="stat-title">
                    Present
                </div>

                <div
                    class="stat-value"
                    id="presentStudents"
                >
                    0
                </div>
            </div>

            <div class="stat">
                <div class="stat-title">
                    Absent
                </div>

                <div
                    class="stat-value"
                    id="absentStudents"
                >
                    0
                </div>
            </div>

            <div class="stat">
                <div class="stat-title">
                    Timed Out
                </div>

                <div
                    class="stat-value"
                    id="timeoutStudents"
                >
                    0
                </div>
            </div>

        </section>


        <!-- TOOLBAR -->

        <section class="toolbar">

            <input
                id="searchInput"
                class="search"
                type="text"
                placeholder="Search student name, ID, or section..."
                oninput="handleSearch()"
            >

            <input
                id="attendanceDate"
                class="date-input"
                type="date"
                onchange="changeDate()"
            >

            <button
                id="filterAll"
                class="filter-btn active"
                onclick="setFilter('all')"
            >
                All
            </button>

            <button
                id="filterPresent"
                class="filter-btn"
                onclick="setFilter('present')"
            >
                Present
            </button>

            <button
                id="filterAbsent"
                class="filter-btn"
                onclick="setFilter('absent')"
            >
                Absent
            </button>

            <button
                id="filterTimeout"
                class="filter-btn"
                onclick="setFilter('timeout')"
            >
                Timed Out
            </button>

            <button
                class="add-btn"
                onclick="openAddStudent()"
            >
                + Add Student
            </button>

        </section>


        <!-- DASHBOARD -->

        <div class="dashboard-grid">

            <!-- STUDENTS -->

            <section class="panel">

                <div class="panel-header">

                    <h3>
                        Student Attendance
                    </h3>

                    <span
                        id="selectedDateLabel"
                        style="font-size:12px;color:#6b7280"
                    ></span>

                </div>

                <div
                    id="studentGrid"
                    class="student-grid"
                ></div>

            </section>


            <!-- SIDEBAR -->

            <aside>

                <!-- LATEST SCAN -->

                <section class="panel sidebar-panel">

                    <div class="panel-header">
                        <h3>Latest Scan</h3>
                    </div>

                    <div
                        id="latestScan"
                        class="latest-scan"
                    >

                        <div class="scan-icon">
                            RFID
                        </div>

                        <div class="latest-name">
                            No scan yet
                        </div>

                        <div class="latest-info">
                            Waiting for RFID scan...
                        </div>

                    </div>

                </section>


                <!-- RECENT SCANS -->

                <section class="panel sidebar-panel">

                    <div class="panel-header">
                        <h3>Recent Scans</h3>
                    </div>

                    <div
                        id="scanList"
                        class="scan-list"
                    >
                        <div class="empty">
                            No recent scans
                        </div>
                    </div>

                </section>


                <!-- PRINT -->

                <section class="panel">

                    <div class="panel-header">
                        <h3>Attendance Report</h3>
                    </div>

                    <button
                        class="print-btn"
                        onclick="printPDF()"
                    >
                        Print PDF Report
                    </button>

                </section>

            </aside>

        </div>

    </main>

</div>


<!-- =========================
     ADD STUDENT MODAL
========================= -->

<div
    id="studentModal"
    class="modal"
>

    <div class="modal-box">

        <div class="modal-header">

            <h3>Add Student</h3>

            <button
                class="close-btn"
                onclick="closeAddStudent()"
            >
                ×
            </button>

        </div>


        <div class="form-grid">

            <div class="form-group">

                <label>
                    Student ID
                </label>

                <input
                    id="studentID"
                    placeholder="2026-0001"
                >

            </div>


            <div class="form-group">

                <label>
                    RFID UID
                </label>

                <input
                    id="studentRFID"
                    placeholder="RFID UID"
                >

            </div>


            <div class="form-group full">

                <label>
                    Full Name
                </label>

                <input
                    id="studentName"
                    placeholder="Juan Dela Cruz"
                >

            </div>


            <div class="form-group full">

                <label>
                    Course / Section
                </label>

                <input
                    id="studentSection"
                    placeholder="BSIT 1A"
                >

            </div>

        </div>


        <button
            class="save-btn"
            onclick="saveStudent()"
        >
            Save Student
        </button>

    </div>

</div>


<!-- TOAST -->

<div
    id="toast"
    class="toast"
></div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    'https://tlmlyymsxihzbmksinfn.supabase.co';

const SUPABASE_KEY =
    'sb_publishable_FWKNh4QI-Iw8sT-IzBcxcg_8epcmbmv';

const TIMEZONE =
    'Asia/Manila';

const sb =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   STATE
========================================================= */

const state = {

    students: [],

    attendance: {},

    scanHistory: [],

    filter: 'all',

    searchQ: '',

    attendanceDate: null,

    mainChannel: null,

    scanChannel: null,

    scanTimer: null

};


/* =========================================================
   HELPERS
========================================================= */

function todayManila(){

    const now = new Date();

    return new Intl.DateTimeFormat(
        'en-CA',
        {
            timeZone: TIMEZONE,
            year:'numeric',
            month:'2-digit',
            day:'2-digit'
        }
    ).format(now);

}


function formatTime(value){

    if(!value) return '--';

    const date = new Date(value);

    return new Intl.DateTimeFormat(
        'en-US',
        {
            timeZone: TIMEZONE,
            hour:'2-digit',
            minute:'2-digit',
            second:'2-digit',
            hour12:true
        }
    ).format(date);

}


function formatDateLong(dateString){

    const date =
        new Date(
            dateString + 'T00:00:00+08:00'
        );

    return new Intl.DateTimeFormat(
        'en-US',
        {
            timeZone:TIMEZONE,
            weekday:'long',
            month:'long',
            day:'numeric',
            year:'numeric'
        }
    ).format(date);

}


function showToast(message){

    const toast =
        document.getElementById('toast');

    toast.textContent = message;

    toast.style.display = 'block';

    clearTimeout(state.scanTimer);

    state.scanTimer =
        setTimeout(
            ()=>{
                toast.style.display = 'none';
            },
            3000
        );

}


/* =========================================================
   LOGIN
========================================================= */

async function login(){

    const email =
        document.getElementById(
            'loginEmail'
        ).value.trim();

    const password =
        document.getElementById(
            'loginPassword'
        ).value;

    const error =
        document.getElementById(
            'loginError'
        );

    error.textContent = '';

    if(!email || !password){

        error.textContent =
            'Please enter your email and password.';

        return;

    }

    try{

        const {error:loginError} =
            await sb.auth.signInWithPassword({

                email:email,

                password:password

            });

        if(loginError){

            error.textContent =
                loginError.message;

            return;

        }

        showApp();

    }catch(err){

        error.textContent =
            err.message;

    }

}


async function logout(){

    await sb.auth.signOut();

    location.reload();

}


function showApp(){

    document.getElementById(
        'loginScreen'
    ).style.display = 'none';

    document.getElementById(
        'app'
    ).style.display = 'block';

    initializeApp();

}


/* =========================================================
   AUTH CHECK
========================================================= */

async function checkAuth(){

    const {
        data
    } = await sb.auth.getSession();

    if(data.session){

        showApp();

    }

}


sb.auth.onAuthStateChange(
    (event,session)=>{

        if(session){

            document.getElementById(
                'loginScreen'
            ).style.display = 'none';

            document.getElementById(
                'app'
            ).style.display = 'block';

        }

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

async function initializeApp(){

    const date =
        todayManila();

    state.attendanceDate =
        date;

    document.getElementById(
        'attendanceDate'
    ).value = date;

    updateDateLabel();

    await loadStudents();

    await loadAttendance(
        state.attendanceDate
    );

    await loadRecentScans();

    setupRealtime();

}

/* =========================================================
   ATTENDANCE
========================================================= */

async function loadAttendance(dateValue){

    state.attendance = {};

    const start =
        `${dateValue}T00:00:00+08:00`;

    const end =
        `${dateValue}T23:59:59+08:00`;

    const {
        data,
        error
    } = await sb
        .from('attendance_records')
        .select('*')
        .gte(
            'timestamp',
            start
        )
        .lte(
            'timestamp',
            end
        )
        .order(
            'timestamp',
            {
                ascending:true
            }
        );

    if(error){

        console.error(error);

        showToast(
            'Failed to load attendance'
        );

        return;

    }


    (data || []).forEach(
        record => {

            const uid =
                String(
                    record.scanned_rfid || ''
                ).trim().toUpperCase();

            if(!uid) return;

            if(!state.attendance[uid]){

                state.attendance[uid] = {

                    inTime:null,

                    outTime:null,

                    status:'present'

                };

            }

            const status =
                String(
                    record.status || ''
                ).toLowerCase();


            if(
                status === 'time out' ||
                status === 'timeout' ||
                status === 'out'
            ){

                state.attendance[uid].outTime =
                    record.timestamp;

                state.attendance[uid].status =
                    'timeout';

            }else{

                if(
                    !state.attendance[uid].inTime
                ){

                    state.attendance[uid].inTime =
                        record.timestamp;

                }

                state.attendance[uid].status =
                    'present';

            }

        }
    );


    renderGrid();

}


/* =========================================================
   RENDER GRID
========================================================= */

function renderGrid(){

    const grid =
        document.getElementById(
            'studentGrid'
        );

    let students =
        [...state.students];


    const query =
        state.searchQ.toLowerCase();


    if(query){

        students =
            students.filter(
                student => {

                    return (

                        String(
                            student.full_name || ''
                        )
                        .toLowerCase()
                        .includes(query)

                        ||

                        String(
                            student.student_id_number || ''
                        )
                        .toLowerCase()
                        .includes(query)

                        ||

                        String(
                            student.course_section || ''
                        )
                        .toLowerCase()
                        .includes(query)

                    );

                }
            );

    }


    students =
        students.filter(
            student => {

                const uid =
                    String(
                        student.rfid_uid || ''
                    ).trim().toUpperCase();

                const record =
                    state.attendance[uid];

                let status =
                    record
                    ? (
                        record.status === 'timeout'
                        ? 'timeout'
                        : 'present'
                    )
                    : 'absent';


                if(
                    state.filter !== 'all'
                    &&
                    state.filter !== status
                ){

                    return false;

                }

                return true;

            }
        );


    if(!students.length){

        grid.innerHTML =
            `<div class="empty">
                No students found.
            </div>`;

        updateStats();

        return;

    }


    grid.innerHTML =
        students.map(
            student => {

                const uid =
                    String(
                        student.rfid_uid || ''
                    ).trim().toUpperCase();

                const record =
                    state.attendance[uid];


                let status =
                    record
                    ? (
                        record.status === 'timeout'
                        ? 'timeout'
                        : 'present'
                    )
                    : 'absent';


                let statusText =
                    status === 'present'
                    ? 'Present'
                    : status === 'timeout'
                    ? 'Timed Out'
                    : 'Absent';


                let statusClass =
                    status === 'present'
                    ? 'status-present'
                    : status === 'timeout'
                    ? 'status-timeout'
                    : 'status-absent';


                return `

                    <div class="student-card">

                        <button
                            class="delete-btn"
                            onclick="deleteStudent('${student.id}')"
                            title="Delete student"
                        >
                            ×
                        </button>

                        <div class="student-name">
                            ${escapeHTML(
                                student.full_name || 'Unnamed'
                            )}
                        </div>

                        <div class="student-id">
                            ID:
                            ${escapeHTML(
                                student.student_id_number || '--'
                            )}
                        </div>

                        <div class="student-section">
                            ${escapeHTML(
                                student.course_section || '--'
                            )}
                        </div>

                        <span
                            class="student-status ${statusClass}"
                        >
                            ${statusText}
                        </span>

                        ${
                            record
                            ?
                            `<div
                                style="
                                    margin-top:9px;
                                    font-size:11px;
                                    color:#6b7280;
                                "
                            >
                                Time In:
                                ${formatTime(record.inTime)}

                                <br>

                                Time Out:
                                ${formatTime(record.outTime)}
                            </div>`
                            :
                            ''
                        }

                    </div>

                `;

            }
        ).join('');


    updateStats();

}


/* =========================================================
   STATS
========================================================= */

function updateStats(){

    let present = 0;

    let timeout = 0;

    let absent = 0;


    state.students.forEach(
        student => {

            const uid =
                String(
                    student.rfid_uid || ''
                ).trim().toUpperCase();

            const record =
                state.attendance[uid];


            if(!record){

                absent++;

            }else if(
                record.status === 'timeout'
            ){

                timeout++;

            }else{

                present++;

            }

        }
    );


    document.getElementById(
        'totalStudents'
    ).textContent =
        state.students.length;


    document.getElementById(
        'presentStudents'
    ).textContent =
        present;


    document.getElementById(
        'absentStudents'
    ).textContent =
        absent;


    document.getElementById(
        'timeoutStudents'
    ).textContent =
        timeout;

}

async function saveStudent(){

        document.getElementById(
            'studentID'
        ).value.trim();

        document.getElementById(
            'studentRFID'
        ).value.trim();

/* =========================================================
   DELETE STUDENT
========================================================= */

async function deleteStudent(id){

    const student =
        state.students.find(
            s => String(s.id) === String(id)
        );


    if(!student) return;


    const confirmed =
        confirm(
            `Delete ${student.full_name}?\n\nThis will remove the student from the student list.`
        );


    if(!confirmed) return;


    const {
        error
    } = await sb
        .from('students')
        .delete()
        .eq(
            'id',
            id
        );


    if(error){

        console.error(error);

        showToast(
            error.message
        );

        return;

    }


    state.students =
        state.students.filter(
            s => String(s.id) !== String(id)
        );


    renderGrid();

    showToast(
        'Student deleted successfully'
    );

}

/* =========================================================
   REALTIME
========================================================= */

function setupRealtime(){

    if(state.mainChannel){

        sb.removeChannel(
            state.mainChannel
        );

    }


    state.mainChannel =
        sb
        .channel(
            'attendance-realtime'
        )
        .on(
            'postgres_changes',
            {
                event:'INSERT',
                schema:'public',
                table:'attendance_records'
            },
            async payload => {

                const record =
                    payload.new;


                const recordDate =
                    new Intl.DateTimeFormat(
                        'en-CA',
                        {
                            timeZone:TIMEZONE,
                            year:'numeric',
                            month:'2-digit',
                            day:'2-digit'
                        }
                    ).format(
                        new Date(
                            record.timestamp
                        )
                    );


                if(
                    recordDate ===
                    state.attendanceDate
                ){

                    await loadAttendance(
                        state.attendanceDate
                    );

                }


                state.scanHistory.unshift(
                    record
                );

                state.scanHistory =
                    state.scanHistory.slice(
                        0,
                        10
                    );


                displayLatestScan(
                    record
                );

                renderRecentScans();

                showToast(
                    'New RFID scan received'
                );

            }
        )
        .subscribe();


    if(state.scanChannel){

        sb.removeChannel(
            state.scanChannel
        );

    }


    state.scanChannel =
        sb
        .channel(
            'unregistered-rfid-realtime'
        )
        .on(
            'postgres_changes',
            {
                event:'INSERT',
                schema:'public',
                table:'unregistered_scans'
            },
            payload => {

                const scan =
                    payload.new;

                showToast(
                    `Unknown RFID detected: ${
                        scan.rfid_uid || ''
                    }`
                );

            }
        )
        .subscribe();

}


/* =========================================================
   IMPROVED PDF REPORT
========================================================= */

async function printPDF(){

    try{

        if(
            !window.jspdf ||
            !window.jspdf.jsPDF
        ){

            showToast(
                'PDF library is not loaded.'
            );

            return;

        }


        const {
            jsPDF
        } = window.jspdf;


        const date =
            state.attendanceDate ||
            todayManila();


        /* ---------------------------------------------
           GET ATTENDANCE FOR SELECTED DATE
        --------------------------------------------- */

        const start =
            `${date}T00:00:00+08:00`;

        const end =
            `${date}T23:59:59+08:00`;


        const {
            data,
            error
        } = await sb
            .from('attendance_records')
            .select('*')
            .gte(
                'timestamp',
                start
            )
            .lte(
                'timestamp',
                end
            )
            .order(
                'timestamp',
                {
                    ascending:true
                }
            );


        if(error){

            console.error(error);

            showToast(
                'Unable to load attendance records.'
            );

            return;

        }


        /* ---------------------------------------------
           PROCESS ATTENDANCE
        --------------------------------------------- */

        const attendance = {};


        (data || []).forEach(
            record => {

                const uid =
                    String(
                        record.scanned_rfid || ''
                    )
                    .trim()
                    .toUpperCase();


                if(!uid) return;


                if(!attendance[uid]){

                    attendance[uid] = {

                        inTime:null,

                        outTime:null,

                        status:'Present'

                    };

                }


                const status =
                    String(
                        record.status || ''
                    )
                    .toLowerCase();


                if(
                    status === 'time out' ||
                    status === 'timeout' ||
                    status === 'out'
                ){

                    attendance[uid].outTime =
                        record.timestamp;

                    attendance[uid].status =
                        'Timed Out';

                }else{

                    if(
                        !attendance[uid].inTime
                    ){

                        attendance[uid].inTime =
                            record.timestamp;

                    }

                    attendance[uid].status =
                        'Present';

                }

            }
        );


        /* ---------------------------------------------
           SUMMARY
        --------------------------------------------- */

        const total =
            state.students.length;


        let present = 0;

        let timedOut = 0;

        let absent = 0;


        state.students.forEach(
            student => {

                const uid =
                    String(
                        student.rfid_uid || ''
                    )
                    .trim()
                    .toUpperCase();


                const record =
                    attendance[uid];


                if(!record){

                    absent++;

                }else if(
                    record.status ===
                    'Timed Out'
                ){

                    timedOut++;

                }else{

                    present++;

                }

            }
        );


        const attendanceRate =
            total > 0
            ? Math.round(
                (
                    (present + timedOut)
                    / total
                ) * 100
            )
            : 0;


        /* ---------------------------------------------
           CREATE PDF
        --------------------------------------------- */

            new jsPDF({
                orientation:'landscape',

            doc.internal.pageSize.getWidth();

        );


        /* ---------------------------------------------

        --------------------------------------------- */

        const cardY = 45;

        const cardH = 22;

                    cardY + 7
                );


                doc.setTextColor(
                    ...DARK
                );

                doc.setFontSize(
                    14
                );

                doc.text(
                    String(card.value),
                    x + 6,
                    cardY + 16
                );

            }
        );


        /* ---------------------------------------------
           ATTENDANCE RATE
        --------------------------------------------- */

        doc.setFillColor(
            ...LIGHT_GOLD
        );

        doc.roundedRect(
            14,
            65,
            pageWidth - 28,
            11,
            2,
            2,
            'F'
        );


        doc.setTextColor(
            ...DARK
        );

        doc.setFont(
            'helvetica',
            'bold'
        );

        doc.setFontSize(
            8
        );

        doc.text(
            'ATTENDANCE RATE',
            19,
            72
        );


        doc.setFontSize(
            10
        );

        doc.text(
            attendanceRate + '%',
            pageWidth - 19,
            72,
            {
                align:'right'
            }
        );


        /* ---------------------------------------------
           TABLE DATA
        --------------------------------------------- */

        const tableRows =
            state.students.map(
                (student,index)=>{

                    const uid =
                        String(
                            student.rfid_uid || ''
                        )
                        .trim()
                        .toUpperCase();


                    const record =
                        attendance[uid];


                    let status =
                        'Absent';


                    let timeIn =
                        '--';


                    let timeOut =
                        '--';


                    if(record){

                        status =
                            record.status ||
                            'Present';


                        timeIn =
                            formatTime(
                                record.inTime
                            );


                        timeOut =
                            formatTime(
                                record.outTime
                            );

                    }


                    return [

                        index + 1,

                        student.student_id_number ||
                        '--',

                        student.full_name ||
                        '--',

                        student.course_section ||
                        '--',

                        status,

                        timeIn,

                        timeOut

                    ];

                }
            );


        /* ---------------------------------------------
           TABLE
        --------------------------------------------- */

        doc.autoTable({

            startY:81,

            margin:{
                left:14,
                right:14,
                bottom:22
            },

            head:[[
                'No.',
                'Student ID',
                'Full Name',
                'Course / Section',
                'Status',
                'Time In',
                'Time Out'
            ]],

            body:tableRows,

            theme:'grid',

            styles:{

                font:'helvetica',

                fontSize:8,

                cellPadding:3,

                lineColor:[
                    220,
                    220,
                    220
                ],

                lineWidth:.2,

                textColor:[
                    45,
                    45,
                    45
                ],

                valign:'middle'

            },

            headStyles:{

                fillColor:MAROON,

                textColor:[
                    255,
                    255,
                    255
                ],

                fontStyle:'bold',

                halign:'center',

                fontSize:8

            },

            alternateRowStyles:{

                fillColor:[
                    250,
                    250,
                    250
                ]

            },

            columnStyles:{

                0:{
                    halign:'center',
                    cellWidth:10
                },

                1:{
                    cellWidth:28
                },

                2:{
                    cellWidth:63
                },

                3:{
                    cellWidth:47
                },

                4:{
                    halign:'center',
                    cellWidth:30
                },

                5:{
                    halign:'center',
                    cellWidth:31
                },

                6:{
                    halign:'center',
                    cellWidth:31
                }

            },


            didParseCell:function(
                hookData
            ){

                if(
                    hookData.section ===
                    'body'
                    &&
                    hookData.column.index === 4
                ){

                    const text =
                        String(
                            hookData.cell.text[0] ||
                            ''
                        ).toLowerCase();


                    if(text === 'present'){

                        hookData.cell.styles.textColor =
                            GREEN;

                        hookData.cell.styles.fontStyle =
                            'bold';

                    }


                    if(text === 'absent'){

                        hookData.cell.styles.textColor =
                            RED;

                        hookData.cell.styles.fontStyle =
                            'bold';

                    }


                    if(
                        text === 'timed out'
                    ){

                        hookData.cell.styles.textColor =
                            BLUE;

                        hookData.cell.styles.fontStyle =
                            'bold';

                    }

                }

            },


            didDrawPage:function(){

                const pageNumber =
                    doc.internal.getNumberOfPages();


                /* FOOTER */

                doc.setDrawColor(
                    ...GOLD
                );

                doc.setLineWidth(
                    .5
                );

                doc.line(
                    14,
                    pageHeight - 16,
                    pageWidth - 14,
                    pageHeight - 16
                );


                doc.setFont(
                    'helvetica',
                    'normal'
                );

                doc.setFontSize(
                    7
                );

                doc.setTextColor(
                    ...GRAY
                );


                doc.text(
                    'Global Academy • Smart RFID Attendance System',
                    14,
                    pageHeight - 10
                );


                const generated =
                    new Intl.DateTimeFormat(
                        'en-US',
                        {
                            timeZone:TIMEZONE,
                            year:'numeric',
                            month:'short',
                            day:'numeric',
                            hour:'2-digit',
                            minute:'2-digit',
                            hour12:true
                        }
                    ).format(
                        new Date()
                    );


                doc.text(
                    'Generated: ' + generated,
                    pageWidth / 2,
                    pageHeight - 10,
                    {
                        align:'center'
                    }
                );


                doc.text(
                    'Page ' +
                    pageNumber,
                    pageWidth - 14,
                    pageHeight - 10,
                    {
                        align:'right'
                    }
                );

            }

        });


        /* ---------------------------------------------
           SIGNATURE AREA
        --------------------------------------------- */

        let finalY =
            doc.lastAutoTable
            ? doc.lastAutoTable.finalY + 15
            : 100;


        if(
            finalY >
            pageHeight - 45
        ){

            doc.addPage();

            finalY = 30;

        }


        doc.setTextColor(
            ...DARK
        );

        doc.setFont(
            'helvetica',
            'bold'
        );

        doc.setFontSize(
            8
        );

        doc.text(
            'Prepared by:',
            35,
            finalY
        );

        doc.text(
            'Approved by:',
            pageWidth - 105,
            finalY
        );


        doc.setDrawColor(
            80,
            80,
            80
        );


        doc.line(
            25,
            finalY + 15,
            95,
            finalY + 15
        );


        doc.line(
            pageWidth - 115,
            finalY + 15,
            pageWidth - 45,
            finalY + 15
        );


        doc.setFont(
            'helvetica',
            'normal'
        );

        doc.setFontSize(
            7
        );

        doc.setTextColor(
            ...GRAY
        );


        doc.text(
            'Teacher / Adviser',
            60,
            finalY + 20,
            {
                align:'center'
            }
        );


        doc.text(
            'School Administrator',
            pageWidth - 80,
            finalY + 20,
            {
                align:'center'
            }
        );


        /* ---------------------------------------------
           NO RECORD NOTICE
        --------------------------------------------- */

        if(
            state.students.length === 0
        ){

            doc.setFont(
                'helvetica',
                'bold'
            );

            doc.setFontSize(
                12
            );

            doc.setTextColor(
                ...RED
            );

            doc.text(
                'No students registered.',
                pageWidth / 2,
                105,
                {
                    align:'center'
                }
            );

        }


        if(
            state.students.length > 0 &&
            (data || []).length === 0
        ){

            /*
             * This is intentionally only a small note
             * because the table already shows students
             * as absent.
             */

            doc.setFont(
                'helvetica',
                'normal'
            );

            doc.setFontSize(
                7
            );

            doc.setTextColor(
                ...GRAY
            );

            doc.text(
                'No RFID attendance scans were recorded for this date.',
                14,
                78
            );

        }


        /* ---------------------------------------------
           SAVE
        --------------------------------------------- */

        const filename =
            `Global_Academy_Attendance_${date}.pdf`;


        doc.save(
            filename
        );


        showToast(
            'PDF report generated successfully'
        );


    }catch(error){

        console.error(
            'PDF ERROR:',
            error
        );

        showToast(
            'Failed to generate PDF: ' +
            error.message
        );

    }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(
        value ?? ''
    )
    .replace(
        /&/g,
        '&amp;'
    )
    .replace(
        /</g,
        '&lt;'
    )
    .replace(
        />/g,
        '&gt;'
    )
    .replace(
        /"/g,
        '&quot;'
    )
    .replace(
        /'/g,
        '&#039;'
    );

}

   ENTER KEY LOGIN
========================================================= */

document
    .getElementById('loginPassword')
    .addEventListener(
        'keydown',
        function(event){

            if(
                event.key === 'Enter'
            ){

                login();

            }

        }
    );


/* =========================================================

========================================================= */

checkAuth();

</script>
